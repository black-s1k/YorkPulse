# .github/workflows/deploy.yml
# Full CI/CD pipeline for YorkPulse deployment.
# Triggered on push to main when backend, frontend, or infra files change.
#
# Three jobs run in sequence:
#   1. security-scan       — SAST + dependency audit + container CVE scan + IaC misconfig check
#   2. deploy-backend-lambda — Build + push to ECR → update Lambda functions → smoke test
#   3. deploy-frontend      — Deploy to Vercel via CLI → smoke test
#
# NOTE: AWS ECS and Azure Container Apps deploy steps are preserved below,
# commented out with "# Preserved for infrastructure restore". See multicloud/RESTORE.md
# to switch back to the multi-cloud stack. Render has been decommissioned.

name: Deploy YorkPulse

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "multicloud/**"
      - ".github/workflows/**"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

# Prevent multiple deploys from running simultaneously.
# cancel-in-progress: false means a queued deploy waits rather than being killed —
# safer than cancelling a deploy that's halfway through a rollout.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Security Scan
  # Runs SAST (Bandit), dependency audit (pip-audit), container CVE scan (Trivy),
  # and Terraform misconfiguration check (Checkov) — all non-blocking (exit-zero)
  # so the pipeline reports issues without stopping a deploy for low-severity findings.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bandit: Python SAST tool — scans for common security issues in Python code.
      # -ll = report medium and high severity only (skip low noise).
      # --exit-zero = always exit 0 so pipeline continues; issues appear in logs.
      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit pip-audit
          bandit -r backend/ -ll --exit-zero

      # pip-audit: checks backend/requirements.txt against CVE databases (PyPI Advisory DB + OSV).
      # Replaces Safety which requires interactive login in v3+, making it unusable in CI.
      # --no-deps = only audit pinned packages, don't resolve transitive deps (faster).
      # exit code is non-zero on findings, so we use || true to keep the pipeline non-blocking.
      - name: Run pip-audit (dependency CVE audit)
        run: |
          pip-audit -r backend/requirements.txt --no-deps || true

      # Docker Buildx: needed for --platform linux/amd64 cross-platform builds
      # on GitHub's ubuntu-latest runners (which are x86_64).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the backend image locally for scanning — don't push anywhere.
      # This is a dry-run build to catch Dockerfile issues and give Trivy an image to scan.
      - name: Build backend image for scanning
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t yorkpulse-backend:scan \
            --load \
            ./backend

      # Trivy: scans the built Docker image for known CVEs in OS packages and language libs.
      # exit-code: 0 = report findings but don't fail the pipeline.
      # severity: CRITICAL,HIGH = only surface the most important issues.
      - name: Run Trivy (container CVE scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: yorkpulse-backend:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      # Checkov: static analysis for Terraform files.
      # Checks for common misconfigs (open security groups, unencrypted S3, etc.).
      # soft_fail: true = report issues without blocking the deploy.
      - name: Run Checkov (Terraform IaC scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: multicloud/infra/aws
          soft_fail: true

  # ---------------------------------------------------------------------------
  # Job 2: Deploy Backend (AWS Lambda) — free-tier AWS backend, see yorku.md
  #
  # Render has been decommissioned — api.yorkpulse.com now points at
  # CloudFront/Lambda (DNS cutover done 2026-08-26). This is the only
  # backend deploy path now.
  #
  # Required GitHub secret: AWS_ROLE_ARN
  #   arn:aws:iam::062677866920:role/yorkpulse-github-actions-deploy-role
  #   (OIDC role, no stored credentials — scoped to this repo's main branch,
  #   ecr push on yorkpulse-backend-lambda only, lambda:UpdateFunctionCode on
  #   only the two YorkPulse functions)
  # ---------------------------------------------------------------------------
  deploy-backend-lambda:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      id-token: write # required for OIDC token exchange with AWS
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU: registers arm64 emulation so this x86_64 runner can execute an
      # arm64 build. setup-buildx-action alone only gets you a builder that
      # supports --push; it doesn't add cross-arch emulation by itself.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The default "docker" buildx driver can't --push directly — needs the
      # docker-container driver this action creates. (security-scan's build
      # uses the same action for its own separate runner/job.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # provenance/sbom disabled: Lambda's image validation rejects the extra
      # OCI attestation manifest that buildx attaches by default.
      - name: Build and push Lambda image to ECR
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            -f backend/Dockerfile.lambda \
            -t 062677866920.dkr.ecr.us-east-1.amazonaws.com/yorkpulse-backend-lambda:${{ github.sha }} \
            --push \
            ./backend

      - name: Run DB migrations
        run: |
          pip install -r backend/requirements.txt --quiet
          cd backend && alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Update Lambda function code
        run: |
          IMAGE_URI=062677866920.dkr.ecr.us-east-1.amazonaws.com/yorkpulse-backend-lambda:${{ github.sha }}
          aws lambda update-function-code --function-name yorkpulse-backend --image-uri "$IMAGE_URI"
          aws lambda update-function-code --function-name yorkpulse-quest-cleanup --image-uri "$IMAGE_URI"
          aws lambda wait function-updated --function-name yorkpulse-backend
          aws lambda wait function-updated --function-name yorkpulse-quest-cleanup

      # Smoke test through CloudFront (the real traffic path) — origin is an
      # API Gateway HTTP API, not a Lambda Function URL. CloudFront OAC/SigV4
      # signing for Function URLs doesn't support POST/PUT/PATCH bodies without
      # the client pre-computing a payload hash, so the origin was switched to
      # API Gateway (invoked via a normal authenticated service-principal
      # permission) with a shared-secret header (X-Origin-Verify, checked in
      # app/handler.py) for origin protection instead. See yorku.md.
      - name: Smoke test backend health endpoint
        run: |
          curl --retry 10 --retry-delay 15 --retry-connrefused --fail \
            https://d37rho1vxqudj6.cloudfront.net/api/v1/health

  # ---------------------------------------------------------------------------
