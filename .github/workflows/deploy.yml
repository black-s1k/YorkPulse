  # ---------------------------------------------------------------------------
  # Job 3: Deploy Frontend (Vercel)
  # Uses the Vercel CLI to deploy the Next.js frontend to production.
  # Runs only after deploy-backend succeeds — ensures the API is live first.
  #
  # Required GitHub secrets:
  #   VERCEL_TOKEN        — from Vercel dashboard → Account Settings → Tokens
  #   VERCEL_ORG_ID       — from .vercel/project.json after `vercel link`
  #   VERCEL_PROJECT_ID   — from .vercel/project.json after `vercel link`
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend-lambda

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Vercel CLI globally so we can run `vercel --prod`.
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Deploy to Vercel production using the CLI token.
      # --prod = promote to production (not a preview deploy).
      # --build-env bakes NEXT_PUBLIC_API_URL into the Next.js build at deploy time.
      # Vercel inlines NEXT_PUBLIC_* vars during `next build` — must be provided here.
      - name: Deploy to Vercel
        run: |
          vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --build-env NEXT_PUBLIC_API_URL=https://api.yorkpulse.com \
            --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Hit the Vercel frontend to confirm the new deploy is live.
      # --retry 5 --retry-delay 10 = up to 50s of retries to account for
      # Vercel's propagation time after promotion to production.
      - name: Smoke test frontend URL
        run: |
          curl --retry 5 --retry-delay 10 --fail \
            https://YOUR_VERCEL_FRONTEND_URL
          # TODO: Replace YOUR_VERCEL_FRONTEND_URL with your actual Vercel URL
          # e.g. https://yorkpulse.vercel.app  or  https://yorkpulse.com

